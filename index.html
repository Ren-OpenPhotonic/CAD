<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LightCAD - 倾角演化与局部坐标基准面系统</title>
<style>
:root{--bg:#f3f1ec;--pn:#fbfaf7;--ink:#1d2430;--mut:#66707d;--ln:#d8d4ca;--ac:#0d6b78;--ac2:#b4570f;--vp:#14171d;--sel:#d7eff2;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#14181f;--pn:#1b212b;--ink:#e6e9ee;--mut:#8c95a3;--ln:#2e3644;--ac:#4fc0cf;--ac2:#f0a04b;--vp:#0e1117;--sel:#17343b}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "PingFang SC","Microsoft YaHei",sans-serif}
#app{display:flex;height:100%}
#panel{width:420px;max-width:100%;overflow-y:auto;background:var(--pn);border-right:1px solid var(--ln);padding:16px}
#view{flex:1;position:relative;min-width:0;background:var(--vp);overflow:hidden}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
@media(max-width:850px){#app{flex-direction:column-reverse}#panel{width:100%;height:60%;border-right:0;border-top:1px solid var(--ln)}#view{flex:none;height:40%}}
h1{font:600 20px ui-monospace,Menlo,monospace;margin:0 0 2px}
h2{font-size:13.5px;font-weight:600;margin:14px 0 6px;padding-top:10px;border-top:1px solid var(--ln)}
.sub{color:var(--mut);font-size:12px;margin:0 0 10px}
label{display:block;font-size:12px;color:var(--mut);margin:6px 0 2px}
input,select{width:100%;padding:6px 8px;border:1px solid var(--ln);border-radius:4px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:grid;gap:8px}.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:1fr 1fr 1fr}
.seg{display:flex;border:1px solid var(--ln);border-radius:4px;overflow:hidden;margin-top:6px}
.seg label{flex:1;margin:0;text-align:center;padding:6px;cursor:pointer;color:var(--ink)}
.seg input{display:none}.seg label:has(input:checked){background:var(--ac);color:#fff;font-weight:600}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:4px;padding:6px 10px}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600;width:100%;margin-top:12px;padding:9px}

/* 空白拾取槽 */
.pick-box{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 10px;border:1px solid var(--ln);border-radius:4px;
  background:var(--bg);cursor:pointer;min-height:36px;transition:all .15s ease
}
.pick-box:hover{border-color:var(--ac)}
.pick-box.active{outline:2px solid var(--ac);border-color:var(--ac);background:var(--sel);font-weight:600}
.pick-text{font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-text.empty{color:var(--mut);font-style:italic}
.pick-clear{border:0;background:transparent;color:var(--mut);padding:0 4px;font-size:13px;display:none}
.pick-box.filled .pick-clear{display:block}
.pick-clear:hover{color:#e65050}

/* 可折叠结构树 */
#ft{position:absolute;z-index:5;top:12px;left:12px;width:280px;max-height:calc(100% - 24px);display:flex;flex-direction:column;
border:1px solid var(--ln);border-radius:6px;background:color-mix(in srgb,var(--pn) 85%,transparent);backdrop-filter:blur(8px)}
#fth{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-weight:600;font-size:13px}
#ftb{overflow-y:auto;padding:0 6px 6px}
.ph{padding:4px 6px;margin-top:4px;background:var(--bg);border-radius:4px;font-size:12px}
.ph-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;padding:2px 0}
.ph-header:hover{color:var(--ac)}
.ph-title{display:flex;align-items:center;gap:4px;font-weight:600}
.arrow{font-size:10px;display:inline-block;transition:transform .15s ease}
.ph.shut .arrow{transform:rotate(-90deg)}
.ph.shut .ph-body{display:none}
.ph-body{margin-top:4px;padding-left:8px;border-left:2px solid var(--ln)}
.edge-grp{margin-top:4px}
.edge-grp-title{font-size:11px;color:var(--mut);font-weight:600;margin:2px 0}
.edge-row{display:flex;align-items:center;justify-content:space-between;padding:3px 6px;margin:2px 0;border-radius:3px;cursor:pointer;font-size:11.5px}
.edge-row:hover{background:color-mix(in srgb,var(--ac) 20%,transparent);color:var(--ac)}
.edge-row.selected{background:var(--sel);color:var(--ac);font-weight:600}

.btn-small{
  border:1px solid var(--ln);background:var(--bg);padding:2px 6px;font-size:11px;
  border-radius:3px;cursor:pointer;display:inline-flex;align-items:center;gap:3px
}
.btn-small.active{background:var(--ac2);color:#fff;border-color:var(--ac2);font-weight:600}

#exbar{position:absolute;z-index:6;top:12px;right:12px;display:flex;gap:6px}
.pt-row{display:grid;grid-template-columns:55px 1fr 1fr 55px;gap:6px;align-items:center;margin-top:4px}
.pt-row span{font-size:11.5px;color:var(--mut)}
.pt-cur{font-size:10.5px;color:var(--ac);font-family:monospace;text-align:right}
#statusMsg{margin-top:8px;font-size:12px;color:var(--ac2);min-height:18px}
</style>
<script type="importmap">
{"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
"three-mesh-bvh":"https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.3/build/index.module.js",
"three-bvh-csg":"https://cdn.jsdelivr.net/npm/three-bvh-csg@0.0.16/build/index.module.js"}}
</script>
</head>
<body>
<div id="app">
<aside id="panel">
  <h1>LightCAD</h1>
  <p class="sub">几何演化设计系统 · 倾角演化与实体贴合</p>

  <!-- ================= 基准面构造 ================= -->
  <h2>0. 基准面构造 (Datum Plane)</h2>
  <div class="seg">
    <label><input type="radio" name="planeMode" value="STD" checked>标准面 + 偏置</label>
    <label><input type="radio" name="planeMode" value="REF">引用实体棱边 (双棱)</label>
  </div>

  <div id="secStdPlane" style="margin-top:8px">
    <div class="row c2">
      <div>
        <label>基准投影面</label>
        <select id="stdPlaneSelect">
          <option value="XY">XY 平面 (水平 / 沿 Z 拉伸)</option>
          <option value="XZ">XZ 平面 (正立 / 沿 Y 拉伸)</option>
          <option value="YZ">YZ 平面 (侧立 / 沿 X 拉伸)</option>
        </select>
      </div>
      <div>
        <label>平行偏置距离 d (mm)</label>
        <input id="planeOffset" type="number" value="0" step="1">
      </div>
    </div>
  </div>

  <div id="secRefPlane" style="display:none;margin-top:8px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <label>基准轴 1 (走刀 ΔX 轴)</label>
      <button type="button" id="btnFlipE1" class="btn-small" title="将原点切换到棱边的另一端">⇄ 翻转原点端点</button>
    </div>
    <div class="pick-box active" id="boxAxis1" data-slot="1">
      <span class="pick-text empty" id="txtAxis1">点击后，在右侧结构树选择棱边</span>
      <button class="pick-clear" id="clrAxis1" type="button">✕</button>
    </div>

    <label style="margin-top:6px">基准轴 2 (走刀 ΔY 方向参考)</label>
    <div class="pick-box" id="boxAxis2" data-slot="2">
      <span class="pick-text empty" id="txtAxis2">点击后，在右侧结构树选择棱边</span>
      <button class="pick-clear" id="clrAxis2" type="button">✕</button>
    </div>
    <p id="planeDesc" class="sub" style="margin-top:6px">视口中：⚪白点为原点(0,0)，🔴红箭为局部X轴，🟢绿箭为局部Y轴。</p>
  </div>

  <!-- ================= 截面形式 ================= -->
  <h2>1. 截面形式 (Profile)</h2>
  <div class="seg">
    <label><input type="radio" name="profileType" value="POLYGON" checked>多边形 (走刀增量)</label>
    <label><input type="radio" name="profileType" value="CIRCLE">圆 (数学曲面)</label>
  </div>

  <!-- 圆截面：半径 + 面内圆心坐标 -->
  <div id="secCircle" style="display:none;margin-top:8px">
    <label>圆半径 R (mm)</label>
    <input id="cRadius" type="number" value="15" min="0.1" step="1">
    <div class="row c2" style="margin-top:6px">
      <div><label>基准面圆心 X (mm)</label><input id="cCenX" type="number" value="0" step="1"></div>
      <div><label>基准面圆心 Y (mm)</label><input id="cCenY" type="number" value="0" step="1"></div>
    </div>
  </div>

  <div id="secPolygon" style="margin-top:8px">
    <label>多边形边数 (点数 N)</label>
    <input id="polyN" type="number" value="4" min="3" max="32" step="1">
    
    <label style="margin-top:8px">端点序列：面内相对增量 (ΔX, ΔY)</label>
    <div id="ptsList"></div>
    <p id="closeInfo" class="sub" style="margin-top:6px;color:var(--ac2)"></p>
  </div>

  <!-- ================= 顶面演化规则 (倾斜角) ================= -->
  <h2>2. 顶面演化规则 (Top Evolution)</h2>
  <div class="row c2">
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <label>拉伸高度 H (mm)</label>
        <button type="button" id="btnToggleDir" class="btn-small">⇄ 正向</button>
      </div>
      <input id="pHeight" type="number" value="30" step="1" min="0.1">
    </div>
    <div><label>顶面缩放比 K</label><input id="pScale" type="number" value="1.0" step="0.05" min="0" placeholder="1=柱, 0=尖锥, 0.5=台"></div>
  </div>
  <div class="row c2">
    <div><label>X 向倾斜角 θx (度)</label><input id="pAngX" type="number" value="0" step="1" placeholder="0° 为垂直"></div>
    <div><label>Y 向倾斜角 θy (度)</label><input id="pAngY" type="number" value="0" step="1" placeholder="0° 为垂直"></div>
  </div>
  <p id="tiltInfo" class="sub" style="margin-top:4px"></p>

  <!-- ================= 角色 ================= -->
  <h2>3. 布尔角色</h2>
  <div class="seg">
    <label><input type="radio" name="role" value="SOLID" checked>实体 (加法)</label>
    <label><input type="radio" name="role" value="HOLE">切削孔 (减法)</label>
  </div>

  <button class="pri" id="gen">执行生成 / 切削</button>
  <div id="statusMsg"></div>
</aside>

<main id="view">
  <div id="ft">
    <div id="fth"><span>设计拓扑结构树</span><button id="clrAll">清空</button></div>
    <div id="ftb"></div>
  </div>
  <div id="exbar">
    <button id="exObj">导出 OBJ</button>
    <button id="exStl">导出 STL</button>
    <button id="exPdf" style="background:var(--ac);color:#fff;font-weight:600">导出国标工程图</button>
  </div>
</main>
</div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {Brush,Evaluator,SUBTRACTION} from 'three-bvh-csg';

const $=s=>document.querySelector(s);

/* 场景与灯光 */
const view=$('#view'), renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
view.appendChild(renderer.domElement);
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(45,1,0.1,5000);
camera.up.set(0,0,1); camera.position.set(70,-90,65);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x444f5a,1.2));
const dl=new THREE.DirectionalLight(0xffffff,1.5); dl.position.set(50,-40,90); scene.add(dl);
const grid=new THREE.GridHelper(200,20,0x7a8594,0x2b3342); grid.rotation.x=Math.PI/2; scene.add(grid);
scene.add(new THREE.AxesHelper(30));

const solidMat=new THREE.MeshStandardMaterial({color:0x8fa9c9,metalness:.2,roughness:.5,flatShading:true,side:THREE.DoubleSide});
const ghostMat=new THREE.MeshBasicMaterial({color:0xd04a3a,transparent:true,opacity:.25,wireframe:true});
const modelGroup=new THREE.Group(); scene.add(modelGroup);

const previewGroup=new THREE.Group(); scene.add(previewGroup);
const datumPlaneHelperGroup=new THREE.Group(); scene.add(datumPlaneHelperGroup);
const highlightGroup=new THREE.Group(); scene.add(highlightGroup);
const selectedHighlightGroup=new THREE.Group(); scene.add(selectedHighlightGroup);

function resize(){
  const w=view.clientWidth, h=view.clientHeight;
  renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view); resize();
renderer.setAnimationLoop(()=>{ controls.update(); renderer.render(scene,camera); });

/* 多边形增量模型 */
let polyInputData = {
  start: { x: 0, y: 0 },
  deltas: [
    { dx: 20, dy: 0 },
    { dx: 0,  dy: 20 },
    { dx: -20, dy: 0 }
  ]
};

function computeAbsolutePoints() {
  const pts = [{ x: polyInputData.start.x, y: polyInputData.start.y }];
  let cur = { ...pts[0] };
  for (let i = 0; i < polyInputData.deltas.length; i++) {
    cur = {
      x: cur.x + (polyInputData.deltas[i].dx || 0),
      y: cur.y + (polyInputData.deltas[i].dy || 0)
    };
    pts.push(cur);
  }
  return pts;
}

/* 状态管理 */
let allExtractedEdges = [];
let activeSlot = 1;
let selectedEdge1 = null;
let selectedEdge2 = null;
let isFlipEdge1 = false;       // 翻转基准轴 1 的端点
let collapsedFeatures = new Set();
let isReverseExtrude = false;

// 翻转轴 1 端点按钮
$('#btnFlipE1').onclick = () => {
  isFlipEdge1 = !isFlipEdge1;
  $('#btnFlipE1').classList.toggle('active', isFlipEdge1);
  updatePickBoxUI();
  updateLivePreview();
};

// 反向拉伸按钮
$('#btnToggleDir').onclick = () => {
  isReverseExtrude = !isReverseExtrude;
  $('#btnToggleDir').classList.toggle('active', isReverseExtrude);
  $('#btnToggleDir').textContent = isReverseExtrude ? '⇄ 反向' : '⇄ 正向';
  updateLivePreview();
};

// 拾取槽激活切换
$('#boxAxis1').onclick = e => {
  if (e.target.id === 'clrAxis1') return;
  activeSlot = 1; updatePickBoxUI();
};
$('#boxAxis2').onclick = e => {
  if (e.target.id === 'clrAxis2') return;
  activeSlot = 2; updatePickBoxUI();
};

$('#clrAxis1').onclick = () => { selectedEdge1 = null; updatePickBoxUI(); updateLivePreview(); };
$('#clrAxis2').onclick = () => { selectedEdge2 = null; updatePickBoxUI(); updateLivePreview(); };

function updatePickBoxUI() {
  const b1 = $('#boxAxis1'), b2 = $('#boxAxis2');
  const t1 = $('#txtAxis1'), t2 = $('#txtAxis2');

  b1.classList.toggle('active', activeSlot === 1);
  b2.classList.toggle('active', activeSlot === 2);

  if (selectedEdge1) {
    b1.classList.add('filled');
    t1.classList.remove('empty');
    const len = selectedEdge1.p1.distanceTo(selectedEdge1.p2).toFixed(1);
    t1.textContent = `${selectedEdge1.name} (${len}mm)${isFlipEdge1 ? ' [已对调原点]' : ''}`;
  } else {
    b1.classList.remove('filled');
    t1.classList.add('empty');
    t1.textContent = activeSlot === 1 ? '【等待点选】请在结构树点击棱边' : '未选择 (点击激活后选棱)';
  }

  if (selectedEdge2) {
    b2.classList.add('filled');
    t2.classList.remove('empty');
    const len = selectedEdge2.p1.distanceTo(selectedEdge2.p2).toFixed(1);
    t2.textContent = `${selectedEdge2.name} (${len}mm)`;
  } else {
    b2.classList.remove('filled');
    t2.classList.add('empty');
    t2.textContent = activeSlot === 2 ? '【等待点选】请在结构树点击棱边' : '未选择 (点击激活后选棱)';
  }

  refreshSelectedEdgeHighlights();
}

function createThickEdgeMesh(p1, p2, radius = 0.8, color = 0x00f0ff) {
  const dir = new THREE.Vector3().subVectors(p2, p1);
  const len = dir.length();
  if (len < 0.001) return new THREE.Group();

  const geom = new THREE.CylinderGeometry(radius, radius, len, 8);
  geom.translate(0, len / 2, 0);
  geom.rotateX(Math.PI / 2);

  const mat = new THREE.MeshBasicMaterial({
    color: color, depthTest: false, transparent: true, opacity: 0.95
  });

  const mesh = new THREE.Mesh(geom, mat);
  mesh.position.copy(p1);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir.clone().normalize());
  mesh.renderOrder = 999;
  return mesh;
}

function refreshSelectedEdgeHighlights() {
  selectedHighlightGroup.clear();
  if (selectedEdge1) {
    selectedHighlightGroup.add(createThickEdgeMesh(selectedEdge1.p1, selectedEdge1.p2, 0.9, 0x00f0ff));
  }
  if (selectedEdge2) {
    selectedHighlightGroup.add(createThickEdgeMesh(selectedEdge2.p1, selectedEdge2.p2, 0.9, 0x00f0ff));
  }
}

/* =========================================================================
   核心几何升级：两平行棱空间定面 + 局部坐标系推导
   ========================================================================= */
function getActiveDatumPlaneFrame() {
  const mode = $('[name=planeMode]:checked').value;
  const O = new THREE.Vector3(0, 0, 0);
  const u = new THREE.Vector3(1, 0, 0);
  const v = new THREE.Vector3(0, 1, 0);
  const n = new THREE.Vector3(0, 0, 1);

  if (mode === 'STD') {
    const std = $('#stdPlaneSelect').value;
    const offset = parseFloat($('#planeOffset').value) || 0;
    if (std === 'XY') {
      O.set(0, 0, offset); u.set(1, 0, 0); v.set(0, 1, 0); n.set(0, 0, 1);
    } else if (std === 'XZ') {
      O.set(0, offset, 0); u.set(1, 0, 0); v.set(0, 0, 1); n.set(0, -1, 0);
    } else if (std === 'YZ') {
      O.set(offset, 0, 0); u.set(0, 1, 0); v.set(0, 0, 1); n.set(1, 0, 0);
    }
  } else {
    if (selectedEdge1) {
      // 轴 1 的端点 (支持端点对调翻转原点)
      const e1p1 = isFlipEdge1 ? selectedEdge1.p2 : selectedEdge1.p1;
      const e1p2 = isFlipEdge1 ? selectedEdge1.p1 : selectedEdge1.p2;

      O.copy(e1p1);
      u.subVectors(e1p2, e1p1).normalize();

      if (selectedEdge2) {
        const vDir = new THREE.Vector3().subVectors(selectedEdge2.p2, selectedEdge2.p1).normalize();
        const crossTest = new THREE.Vector3().crossVectors(u, vDir);

        if (crossTest.lengthSq() < 0.001) {
          // 【核心修复】两棱严格平行！使用从棱 1 指向棱 2 的跨距向量定面
          const wConn = new THREE.Vector3().subVectors(selectedEdge2.p1, e1p1);
          n.crossVectors(u, wConn).normalize();
          if (n.lengthSq() < 0.001) n.set(0, 0, 1);
          v.crossVectors(n, u).normalize();
        } else {
          // 两棱相交或异面
          n.copy(crossTest).normalize();
          v.crossVectors(n, u).normalize();
        }
      } else {
        // 单棱默认找垂直轴
        v.set(0, 0, 1).cross(u).normalize();
        if (v.lengthSq() < 0.001) v.set(0, 1, 0);
        n.crossVectors(u, v).normalize();
      }
    }
  }

  const mat = new THREE.Matrix4().makeBasis(u, v, n);
  mat.setPosition(O);
  return { O, u, v, n, mat };
}

/* 计算倾斜角换算出来的面内位移 (dx, dy) */
function getTiltOffsets(height) {
  const angX = Math.max(-85, Math.min(85, parseFloat($('#pAngX').value) || 0));
  const angY = Math.max(-85, Math.min(85, parseFloat($('#pAngY').value) || 0));
  const dx = height * Math.tan((angX * Math.PI) / 180);
  const dy = height * Math.tan((angY * Math.PI) / 180);
  if (angX !== 0 || angY !== 0) {
    $('#tiltInfo').textContent = `角度换算位移: ΔX=${dx.toFixed(1)}mm, ΔY=${dy.toFixed(1)}mm`;
  } else {
    $('#tiltInfo').textContent = '';
  }
  return { dx, dy, angX, angY };
}

/* =========================================================================
   视口预览：基准面框 + 局部原点红绿轴 (Local Triad) + 走刀轮廓线
   ========================================================================= */
function updateLivePreview() {
  previewGroup.clear();
  datumPlaneHelperGroup.clear();

  const frame = getActiveDatumPlaneFrame();
  const height = Math.max(0.1, parseFloat($('#pHeight').value) || 30);
  getTiltOffsets(height);

  // 1. 基准面半透明参考框
  const planeGeom = new THREE.PlaneGeometry(80, 80);
  const planeMesh = new THREE.Mesh(planeGeom, new THREE.MeshBasicMaterial({
    color: 0x0d6b78, transparent: true, opacity: 0.12, side: THREE.DoubleSide, depthWrite: false
  }));
  planeMesh.applyMatrix4(frame.mat);
  datumPlaneHelperGroup.add(planeMesh);

  // 2. 局部三色坐标轴 (明确显示原点 (0,0) 与走刀正方向！)
  // 原点白球
  const origDot = new THREE.Mesh(new THREE.SphereGeometry(1.2, 12, 12), new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false }));
  origDot.position.copy(frame.O);
  origDot.renderOrder = 999;
  datumPlaneHelperGroup.add(origDot);

  // 红色箭头：局部 X 轴 (走刀 ΔX 正方向)
  const arrowX = new THREE.ArrowHelper(frame.u, frame.O, 18, 0xff3344, 4, 2);
  arrowX.line.material.depthTest = false; arrowX.cone.material.depthTest = false;
  datumPlaneHelperGroup.add(arrowX);

  // 绿色箭头：局部 Y 轴 (走刀 ΔY 正方向)
  const arrowY = new THREE.ArrowHelper(frame.v, frame.O, 18, 0x00e676, 4, 2);
  arrowY.line.material.depthTest = false; arrowY.cone.material.depthTest = false;
  datumPlaneHelperGroup.add(arrowY);

  // 蓝色/橙色箭头：拉伸拔高法向 (正向/反向指示)
  const dirSign = isReverseExtrude ? -1 : 1;
  const arrowZ = new THREE.ArrowHelper(frame.n.clone().multiplyScalar(dirSign), frame.O, 16, isReverseExtrude ? 0xf0a04b : 0x29b6f6, 4, 2);
  arrowZ.line.material.depthTest = false; arrowZ.cone.material.depthTest = false;
  datumPlaneHelperGroup.add(arrowZ);

  // 3. 2D 轮廓预览
  const isCir = $('[name=profileType]:checked').value === 'CIRCLE';
  if (isCir) {
    const r = Math.max(0.1, parseFloat($('#cRadius').value) || 15);
    const cenX = parseFloat($('#cCenX').value) || 0;
    const cenY = parseFloat($('#cCenY').value) || 0;

    // 圆心点标记
    const cDot = new THREE.Mesh(new THREE.SphereGeometry(0.8, 8, 8), new THREE.MeshBasicMaterial({ color: 0x4fc0cf, depthTest: false }));
    cDot.position.copy(new THREE.Vector3(cenX, cenY, 0.05).applyMatrix4(frame.mat));
    previewGroup.add(cDot);

    const circlePts = [];
    for (let i = 0; i <= 64; i++) {
      const a = (i / 64) * Math.PI * 2;
      const ptLocal = new THREE.Vector3(cenX + Math.cos(a) * r, cenY + Math.sin(a) * r, 0.05);
      circlePts.push(ptLocal.applyMatrix4(frame.mat));
    }
    const geom = new THREE.BufferGeometry().setFromPoints(circlePts);
    previewGroup.add(new THREE.Line(geom, new THREE.LineBasicMaterial({ color: 0x4fc0cf, linewidth: 2 })));
  } else {
    const absPts = computeAbsolutePoints();
    const n = absPts.length;
    if (n < 2) return;

    const linePts = absPts.map(p => new THREE.Vector3(p.x, p.y, 0.05).applyMatrix4(frame.mat));
    const lineGeom = new THREE.BufferGeometry().setFromPoints(linePts);
    previewGroup.add(new THREE.Line(lineGeom, new THREE.LineBasicMaterial({ color: 0x4fc0cf, linewidth: 2 })));

    const closePts = [
      new THREE.Vector3(absPts[n - 1].x, absPts[n - 1].y, 0.05).applyMatrix4(frame.mat),
      new THREE.Vector3(absPts[0].x, absPts[0].y, 0.05).applyMatrix4(frame.mat)
    ];
    previewGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(closePts), new THREE.LineBasicMaterial({ color: 0xf0a04b })));

    const dotGeom = new THREE.SphereGeometry(0.8, 8, 8);
    const dotMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    absPts.forEach(p => {
      const m = new THREE.Mesh(dotGeom, dotMat);
      m.position.copy(new THREE.Vector3(p.x, p.y, 0.05).applyMatrix4(frame.mat));
      previewGroup.add(m);
    });
  }
}

function updateCloseHint(absPts) {
  const n = absPts.length;

  const closeDx = (absPts[0].x - last.x).toFixed(1);

  $('#closeInfo').textContent = `自动闭合段 P${n} → P1 跨距: (ΔX=${closeDx}, ΔY=${closeDy})`;
}

/* =========================================================================
   三维几何体生成：倾角剪切变换 (真正支持斜圆柱、斜圆台与斜多棱台)
   ========================================================================= */
function createRawFeature(f) {
  let geom;
  let edges = { bottom: [], vertical: [], top: [] };

  if (f.type === 'CIRCLE') {
    const rBot = f.radius, rTop = Math.max(f.radius * f.scale, 0.001);
    geom = new THREE.CylinderGeometry(rTop, rBot, f.height, 48);
    geom.rotateX(Math.PI / 2);
    geom.translate(0, 0, f.height / 2); // 基底放置在 Z=0

    // 【核心修复】剪切形变：实现严格平滑的任意倾角斜圆柱 / 斜圆台
    const pos = geom.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const z = pos.getZ(i);
      const factor = Math.max(0, Math.min(1, z / f.height));
      const x = pos.getX(i) + f.offsetX * factor + (f.centerX || 0);
      const y = pos.getY(i) + f.offsetY * factor + (f.centerY || 0);
      pos.setXY(i, x, y);
    }
    pos.needsUpdate = true;

    // 反向拉伸支持
    if (f.reverse) {
      for (let i = 0; i < pos.count; i++) pos.setZ(i, -pos.getZ(i));
      pos.needsUpdate = true;
      const idx = geom.index;
      if (idx) {
        for (let i = 0; i < idx.count; i += 3) {
          const a = idx.getX(i); idx.setX(i, idx.getX(i + 1)); idx.setX(i + 1, a);
        }
        idx.needsUpdate = true;
      }
    }

    geom.applyMatrix4(f.frame.mat);
    geom.computeVertexNormals();

    const topZ = f.reverse ? -f.height : f.height;
    edges.vertical.push({
      id: `${f.id}_axis`,
      name: '中心轴线',
      p1: new THREE.Vector3(f.centerX||0, f.centerY||0, 0).applyMatrix4(f.frame.mat),
      p2: new THREE.Vector3((f.centerX||0) + f.offsetX, (f.centerY||0) + f.offsetY, topZ).applyMatrix4(f.frame.mat)
    });
  } else {
    const pts = f.points;
    const n = pts.length;
    if (n < 3) return { geometry: new THREE.BufferGeometry(), edges };

    const shape = new THREE.Shape();
    shape.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < n; i++) shape.lineTo(pts[i].x, pts[i].y);
    shape.closePath();

    geom = new THREE.ExtrudeGeometry(shape, { depth: f.height, bevelEnabled: false });

    let cx = 0, cy = 0;
    pts.forEach(p => { cx += p.x; cy += p.y; });
    cx /= n; cy /= n;

    const pos = geom.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const z = pos.getZ(i);
      if (z > 0.001) {
        const x = pos.getX(i), y = pos.getY(i);
        const nx = cx + (x - cx) * f.scale + (f.offsetX || 0);
        const ny = cy + (y - cy) * f.scale + (f.offsetY || 0);
        pos.setXY(i, nx, ny);
      }
    }

    if (f.reverse) {
      for (let i = 0; i < pos.count; i++) pos.setZ(i, -pos.getZ(i));
      const idx = geom.index;
      if (idx) {
        for (let i = 0; i < idx.count; i += 3) {
          const a = idx.getX(i); idx.setX(i, idx.getX(i + 1)); idx.setX(i + 1, a);
        }
        idx.needsUpdate = true;
      }
    }
    pos.needsUpdate = true;

    geom.applyMatrix4(f.frame.mat);
    geom.computeVertexNormals();

    const topZ = f.reverse ? -f.height : f.height;
    const bPtsWorld = pts.map(p => new THREE.Vector3(p.x, p.y, 0).applyMatrix4(f.frame.mat));
    const tPtsWorld = pts.map(p => {
      const rx = (p.x - cx) * f.scale, ry = (p.y - cy) * f.scale;
      return new THREE.Vector3(
        rx + cx + (f.offsetX || 0),
        ry + cy + (f.offsetY || 0),
        topZ
      ).applyMatrix4(f.frame.mat);
    });

    for (let i = 0; i < n; i++) {
      const next = (i + 1) % n;
      edges.bottom.push({
        id: `${f.id}_Eb${i+1}`,
        name: `底棱 E_b${i+1}`,
        p1: bPtsWorld[i], p2: bPtsWorld[next]
      });
      edges.vertical.push({
        id: `${f.id}_Ev${i+1}`,
        name: `侧棱 E_v${i+1}`,
        p1: bPtsWorld[i], p2: tPtsWorld[i]
      });
      if (f.scale > 0.001) {
        edges.top.push({
          id: `${f.id}_Et${i+1}`,
          name: `顶棱 E_t${i+1}`,
          p1: tPtsWorld[i], p2: tPtsWorld[next]
        });
      }
    }
  }

  return { geometry: geom, edges };
}

/* 场景重建与更新 */
let features = [], count = 0;
const evaluator = new Evaluator();
evaluator.useGroups = false;

function rebuildScene() {
  modelGroup.clear();
  allExtractedEdges = [];

  const solids = features.filter(f => f.role === 'SOLID');
  const holes = features.filter(f => f.role === 'HOLE');

  const solidMeshes = [];
  solids.forEach(f => {
    try {
      const raw = createRawFeature(f);
      f.edges = raw.edges;
      allExtractedEdges.push(...raw.edges.bottom, ...raw.edges.vertical, ...raw.edges.top);
      const mesh = new THREE.Mesh(raw.geometry, solidMat);
      solidMeshes.push({ feat: f, mesh: mesh });
      modelGroup.add(mesh);
    } catch(err) {
      console.error('构建实体失败:', err);
    }
  });

  if (holes.length > 0 && typeof Brush !== 'undefined') {
    holes.forEach(hf => {
      try {
        const hRaw = createRawFeature(hf);
        const hBrush = new Brush(hRaw.geometry, ghostMat);
        hBrush.updateMatrixWorld();
        modelGroup.add(new THREE.Mesh(hRaw.geometry.clone(), ghostMat));

        solidMeshes.forEach(sm => {
          try {
            const sBrush = new Brush(sm.mesh.geometry, solidMat);
            sBrush.updateMatrixWorld();
            const cut = evaluator.evaluate(sBrush, hBrush, SUBTRACTION);
            if (cut && cut.geometry) {
              sm.mesh.geometry.dispose();
              sm.mesh.geometry = cut.geometry;
              sm.mesh.geometry.computeVertexNormals();
            }
          } catch(e) { console.warn('切削计算跳过:', e); }
        });
      } catch(err) { console.error('切孔构建失败:', err); }
    });
  }

  renderTree();
  updateLivePreview();
  refreshSelectedEdgeHighlights();
}

function renderTree() {
  $('#ftb').innerHTML = features.length ? features.map((f, i) => {
    const isShut = collapsedFeatures.has(f.id);
    const ed = f.edges || { bottom:[], vertical:[], top:[] };

    const renderEdgeGroup = (title, list) => {
      if (!list.length) return '';
      return `
        <div class="edge-grp">
          <div class="edge-grp-title">${title}</div>
          ${list.map(e => {
            const len = e.p1.distanceTo(e.p2).toFixed(1);
            const isSel = (selectedEdge1?.id === e.id) || (selectedEdge2?.id === e.id);
            return `
              <div class="edge-row ${isSel ? 'selected' : ''}" data-eid="${e.id}">
                <span>${e.name}</span>
                <span style="color:var(--mut);font-size:10px">${len}mm</span>
              </div>
            `;
          }).join('')}
        </div>
      `;
    };

    return `
      <div class="ph ${isShut ? 'shut' : ''}">
        <div class="ph-header" data-toggle="${f.id}">
          <div class="ph-title">
            <span class="arrow">▼</span>
            <span>${f.role === 'SOLID' ? '📦 实体' : '⭕ 切孔'}_${i+1} [H:${f.height}${f.reverse?'(反)':''} K:${f.scale}]</span>
          </div>
          <button data-del="${f.id}" style="border:0;background:transparent;padding:0 2px">✕</button>
        </div>
        <div class="ph-body">
          ${renderEdgeGroup('底面棱边', ed.bottom)}
          ${renderEdgeGroup('侧向竖棱', ed.vertical)}
          ${renderEdgeGroup('顶面棱边', ed.top)}
        </div>
      </div>
    `;
  }).join('') : '<p class="sub" style="margin:4px">暂无特征</p>';
}

$('#ftb').addEventListener('click', e => {
  const del = e.target.closest('[data-del]');
  if (del) {
    const id = del.dataset.del;
    features = features.filter(f => f.id !== id);
    if (selectedEdge1?.id.startsWith(id)) selectedEdge1 = null;
    if (selectedEdge2?.id.startsWith(id)) selectedEdge2 = null;
    updatePickBoxUI();
    rebuildScene();
    return;
  }

  const toggle = e.target.closest('[data-toggle]');
  if (toggle && !e.target.closest('[data-del]')) {
    const id = toggle.dataset.toggle;
    if (collapsedFeatures.has(id)) collapsedFeatures.delete(id);
    else collapsedFeatures.add(id);
    renderTree();
    return;
  }

  const row = e.target.closest('.edge-row');
  if (row) {
    const eid = row.dataset.eid;
    const edge = allExtractedEdges.find(x => x.id === eid);
    if (edge) {
      document.querySelector('[name=planeMode][value=REF]').checked = true;
      $('#secStdPlane').style.display = 'none';

        selectedEdge1 = edge;
        activeSlot = 2;
        $('#statusMsg').textContent = `已将 [${edge.name}] 设为基准轴 1，请点击选择基准轴 2`;

        selectedEdge2 = edge;
        $('#statusMsg').textContent = `已将 [${edge.name}] 设为基准轴 2，基准面锁定完成！`;

      updatePickBoxUI();

/* 导出标准 STL */
$('#exStl').onclick = () => {
  const meshes = modelGroup.children.filter(m => m.material !== ghostMat);
  if (!meshes.length) { alert('无有效实体！'); return; }

  let totalTris = 0;
  meshes.forEach(m => {
    const g = m.geometry;
    totalTris += g.index ? g.index.count / 3 : g.attributes.position.count / 3;
  });

  const buf = new ArrayBuffer(84 + totalTris * 50), dv = new DataView(buf);
  const hdr = new TextEncoder().encode('LightCAD MultiSolid STL');
  for (let i = 0; i < hdr.length && i < 80; i++) dv.setUint8(i, hdr[i]);
  dv.setUint32(80, totalTris, true);

  let o = 84;
  meshes.forEach(m => {
    const g = m.geometry, pos = g.attributes.position, idx = g.index;
    const count = idx ? idx.count : pos.count;
    for (let i = 0; i < count; i += 3) {
      const i1 = idx ? idx.getX(i) : i, i2 = idx ? idx.getX(i+1) : i+1, i3 = idx ? idx.getX(i+2) : i+2;
      const p1 = new THREE.Vector3().fromBufferAttribute(pos, i1);
      const p2 = new THREE.Vector3().fromBufferAttribute(pos, i2);
      const p3 = new THREE.Vector3().fromBufferAttribute(pos, i3);
      const n = new THREE.Vector3().crossVectors(p2.clone().sub(p1), p3.clone().sub(p1)).normalize();

      [n.x, n.y, n.z, p1.x, p1.y, p1.z, p2.x, p2.y, p2.z, p3.x, p3.y, p3.z].forEach(v => {
        dv.setFloat32(o, v, true); o += 4;
      });
      dv.setUint16(o, 0, true); o += 2;
    }
  });

  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([buf], { type: 'model/stl' }));
  a.download = `Model_${Date.now()}.stl`; a.click();
};

/* 导出工程图 */
function generateDrawing() {
  const solids = features.filter(f => f.role === 'SOLID');
  if (!solids.length) { alert('请先生成实体！'); return; }

  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity, minZ=Infinity, maxZ=-Infinity;
  modelGroup.children.forEach(m => {
    if (m.material === ghostMat) return;
    const pos = m.geometry.attributes.position;
    if (!pos) return;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
      minX = Math.min(minX, x); maxX = Math.max(maxX, x);
      minY = Math.min(minY, y); maxY = Math.max(maxY, y);
      minZ = Math.min(minZ, z); maxZ = Math.max(maxZ, z);
    }
  });

  const realW = Math.max(maxX - minX, 1), realD = Math.max(maxY - minY, 1), realH = Math.max(maxZ - minZ, 1);
  const PW = 297, PH = 210, x0 = 20, y0 = 10, x1 = PW - 10, y1 = PH - 10;
  const availW = x1 - x0 - 130, availH = y1 - y0 - 30;
  let s = Math.min(availW / (realW + realD + 30), availH / (realH + realD + 30));
  let scaleText = s < 0.7 ? '1:2' : s > 1.8 ? '2:1' : '1:1';
  s = s < 0.7 ? 0.5 : s > 1.8 ? 2 : 1;

  const fW = realW * s, fH = realH * s, tW = realW * s, tH = realD * s, lW = realD * s, lH = realH * s;
  const fx0 = x0 + 15, fy0 = y0 + 15, tx0 = fx0, ty0 = fy0 + fH + 22, lx0 = fx0 + fW + 22, ly0 = fy0;

  const toFront = (x, z) => ({ u: fx0 + (x - minX) * s, v: fy0 + (maxZ - z) * s });
  const toTop   = (x, y) => ({ u: tx0 + (x - minX) * s, v: ty0 + (y - minY) * s });
  const toLeft  = (y, z) => ({ u: lx0 + (y - minY) * s, v: ly0 + (maxZ - z) * s });

  let frontSvg = '', topSvg = '', leftSvg = '';

  allExtractedEdges.forEach(e => {
    const fb1 = toFront(e.p1.x, e.p1.z), fb2 = toFront(e.p2.x, e.p2.z);
    frontSvg += `<line x1="${fb1.u}" y1="${fb1.v}" x2="${fb2.u}" y2="${fb2.v}" class="dr-line"/>`;

    const tb1 = toTop(e.p1.x, e.p1.y), tb2 = toTop(e.p2.x, e.p2.y);
    topSvg += `<line x1="${tb1.u}" y1="${tb1.v}" x2="${tb2.u}" y2="${tb2.v}" class="dr-line"/>`;

    const lb1 = toLeft(e.p1.y, e.p1.z), lb2 = toLeft(e.p2.y, e.p2.z);
    leftSvg += `<line x1="${lb1.u}" y1="${lb1.v}" x2="${lb2.u}" y2="${lb2.v}" class="dr-line"/>`;
  });

  const fmt = n => n.toFixed(1).replace(/\.0$/, '');
  const dimH = (x1, x2, y, val) => `<g class="dim"><line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/><line x1="${x1}" y1="${y+3}" x2="${x1}" y2="${y-6}"/><line x1="${x2}" y1="${y+3}" x2="${x2}" y2="${y-6}"/><text x="${(x1+x2)/2}" y="${y-2}" text-anchor="middle">${fmt(val)}</text></g>`;
  const dimV = (x, y1, y2, val) => `<g class="dim"><line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}"/><line x1="${x-3}" y1="${y1}" x2="${x+6}" y2="${y1}"/><line x1="${x-3}" y1="${y2}" x2="${x+6}" y2="${y2}"/><text x="${x+3}" y="${(y1+y2)/2}" dominant-baseline="middle">${fmt(val)}</text></g>`;

  const dimsSvg = `
    ${dimH(fx0, fx0 + fW, fy0 + fH + 10, realW)}
    ${dimV(fx0 + fW + 10, fy0, fy0 + fH, realH)}
    ${dimV(tx0 + tW + 10, ty0, ty0 + tH, realD)}
    ${dimH(lx0, lx0 + lW, ly0 + lH + 10, realD)}
  `;

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${PW}mm" height="${PH}mm" viewBox="0 0 ${PW} ${PH}">
    <style>
      text{font-family:"SimSun","Microsoft YaHei",sans-serif;fill:#000}
      .vh{font-size:3.5px;font-weight:bold}
      .dr-line{stroke:#000;stroke-width:0.45;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .cl-red{stroke:#b4570f;stroke-width:0.22;stroke-dasharray:5 1 1 1}
      .dim line{stroke:#0d6b78;stroke-width:0.22}
      .dim text{font-size:3px;fill:#0d6b78;font-weight:bold;font-family:monospace}
    </style>
    <rect x="5" y="5" width="${PW-10}" height="${PH-10}" fill="none" stroke="#000" stroke-width="0.3"/>
    <rect x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" fill="none" stroke="#000" stroke-width="0.6"/>
    <text x="${fx0}" y="${fy0-5}" class="vh">主视图 (Front · XZ)</text>${frontSvg}
    <text x="${tx0}" y="${ty0-5}" class="vh">俯视图 (Top · XY)</text>${topSvg}
    <text x="${lx0}" y="${ly0-5}" class="vh">左视图 (Left · YZ)</text>${leftSvg}
    ${dimsSvg}
  </svg>`;

  const pWin = window.open('', '_blank');
  if (!pWin) { alert('弹窗被拦截，请允许弹窗后重试。'); return; }
  pWin.document.open();
  pWin.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>工程图输出</title>
  <style>@page{size:A4 landscape;margin:0}html,body{margin:0;padding:0;height:100%;background:#fff}svg{width:100vw;height:100vh;display:block}</style>
  </head><body>${svg}</body></html>`);
  pWin.document.close();
  pWin.focus();
  setTimeout(()=>{ pWin.print(); }, 400);
}

$('#exPdf').onclick = generateDrawing;
renderTree();
updateLivePreview();
</script>
